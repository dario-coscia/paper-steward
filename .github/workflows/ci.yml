name: Paper health
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python plotting dependency
        run: python -m pip install -r requirements.txt
      - name: Install LaTeX (CI runner only)
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Regenerate data, table, figure and provenance
        run: python experiments/generate_convergence.py
      - name: Run objective evals
        run: python -m unittest discover -s evals -v
      - name: Build complete paper
        run: sh scripts/build.sh
      - name: Strict health (includes independent fresh compilation)
        run: python scripts/project_health.py --strict
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: build/main.pdf
